name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package + dev/test dependencies (from uv.lock)
        run: uv sync --extra dev --frozen

      - name: Ruff lint (replaces flake8)
        run: uv run --frozen ruff check .

      - name: Mypy type check
        run: uv run --frozen mypy ondewo

      # Bare `--cov`: the scope lives in pyproject.toml's [tool.coverage.run] `source = ["ondewo"]`,
      # which coverage resolves by scanning the filesystem. The dotted `--cov=<module>` list this
      # step used before only measured modules the suite imported, so an untested file was dropped
      # from the report instead of scored 0% and the gate passed with whole files untested.
      # Generated *_pb2.py / *_pb2_grpc.py stubs are the only thing `omit` takes out.
      - name: Unit tests + 100% coverage gate on hand-written code
        run: |
          uv run --frozen pytest test/unit -q \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100
