[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ondewo-s2t-client"
version = "7.5.0"
description = "ONDEWO Speech 2 Text (S2T) Client library for Python"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ONDEWO GmbH", email = "office@ondewo.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Runtime imports across ondewo/ and examples/ are exactly: grpc, google.protobuf, ondewo.utils,
# requests and urllib3. grpcio-reflection, grpcio-tools, regex and setuptools were never imported
# (grpc_reflection/grpc_tools only appear in sys.modules because grpc's _runtime_protos.py probes
# for them behind try/except); codegen runs in the proto-compiler docker image, not from this
# package. urllib3 is imported directly by client/utils/keycloak.py but arrives with requests,
# which is how ondewo-nlu-client-python declares it too.
dependencies = [
    "grpcio",
    # >=3.3.0 is what finally drops the dataclasses-json -> marshmallow chain (BaseClientConfig implements
    # to_dict/from_dict/to_json/from_json itself). 3.2.0 still supplies those helpers via @dataclass_json, so
    # this package works on both -- raise the floor to >=3.3.0 once client-utils 3.3.0 is on PyPI.
    "ondewo-client-utils>=3.2.0",
    "protobuf",
    "requests",
]

[project.optional-dependencies]
dev = [
    "loguru",
    "mypy",
    "mypy-protobuf",
    "pre-commit",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "types-requests",
    "typing_extensions",
]

[project.urls]
Homepage = "https://github.com/ondewo/ondewo-s2t-client-python"
Repository = "https://github.com/ondewo/ondewo-s2t-client-python"

# ---------------------------------------------------------------------------
# setuptools: package discovery + package data
# Equivalent to the old setup.py:
#   packages = [n for n in find_packages() if n == 'ondewo' or n.startswith('ondewo.')]
#   include_package_data=True + package_data for py.typed / *.pyi
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["ondewo", "ondewo.*"]

[tool.setuptools.package-data]
"ondewo.s2t" = ["py.typed", "*.pyi"]

# ---------------------------------------------------------------------------
# Coverage
# `source` is a FILESYSTEM scan, and that is the whole point: the dotted
# `--cov=ondewo.s2t.client.client_config` form pytest-cov used before only measures modules the
# test suite actually imports, so a module with zero tests was DROPPED from the report instead of
# being scored 0% -- the gate printed "Required test coverage of 100% reached" while entire files
# were untested. With `source = ["ondewo"]` every .py under ondewo/ is measured whether or not a
# test imports it, so a new untested file makes `--cov-fail-under=100` go red. CI therefore passes
# a bare `--cov` and takes the scope from here.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["ondewo"]
omit = [
    # Generated protobuf/gRPC stubs (protoc + mypy-protobuf output, ~95% of the repo);
    # regenerated by `make generate_ondewo_protos` from ondewo-s2t-api. Not our code. The .pyi
    # stubs alongside them are not executable Python and are never measured in the first place.
    "ondewo/*/*_pb2.py",
    "ondewo/*/*_pb2_grpc.py",
]

[tool.coverage.report]
show_missing = true
# ondewo/s2t/scripts/ has no __init__.py, so coverage's package walk skips the directory entirely
# and generate_services.py silently vanishes from the report -- the same fail-open shape as the
# dotted --cov form. This keeps any future __init__.py-less directory measured.
include_namespace_packages = true
exclude_lines = [
    # Setting exclude_lines REPLACES coverage's built-in pragma pattern; re-state the default.
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Ruff  (replaces flake8: ignore C901,W504; max-line-length 120; exclude *_pb2*)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py39"
# Never lint/format the generated protobuf/gRPC stubs (the old .flake8 excluded
# ondewo/s2t/speech_to_text_pb2*.py / .pyi individually).
extend-exclude = [
    "*_pb2.py",
    "*_pb2.pyi",
    "*_pb2_grpc.py",
    "ondewo-s2t-api",
    "ondewo-proto-compiler",
    # flake8 (the tool being replaced) never linted Jupyter notebooks; ruff does
    # by default. Keep the example notebooks out of scope to preserve behaviour.
    "*.ipynb",
]

[tool.ruff.lint]
# pycodestyle (E/W) + pyflakes (F) == the flake8 default rule set.
# C901 (mccabe complexity) is intentionally NOT enabled -> old "ignore = C901".
# W503/W504 (line break around binary operator) are not implemented by ruff,
# so the old "ignore = W504" is a no-op here.
select = ["E", "F", "W"]
ignore = []

[tool.ruff.format]
# Supersedes the old black + autopep8 hooks.
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy  (translated faithfully from mypy.ini)
# ---------------------------------------------------------------------------
# python_version tracks the oldest mypy-supported interpreter (3.10); runtime
# support still spans 3.9-3.12 via requires-python / classifiers. mypy.ini said
# 3.9, but mypy >= 2.x rejects it ("must be 3.10 or higher").
[tool.mypy]
python_version = "3.10"
ignore_errors = false
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_traceback = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true

# Generated protobuf / gRPC stubs: never type-check them.
[[tool.mypy.overrides]]
module = [
    "ondewo.s2t.speech_to_text_pb2",
    "ondewo.s2t.speech_to_text_pb2_grpc",
]
ignore_errors = true
ignore_missing_imports = true

# Third-party packages without (complete) type stubs.
[[tool.mypy.overrides]]
module = [
    "google.protobuf.*",
    "grpc.*",
    "ondewo.utils.*",
]
ignore_missing_imports = true
